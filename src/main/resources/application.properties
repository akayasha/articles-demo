spring.application.name=articles-demo

# DataSource
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=pass

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=group-1
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.articlesdemo
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.articlesdemo.dto.request.ArticleRequest
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

